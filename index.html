<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLARIO — Come confused. Leave with clarity.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLARIO — DESIGN TOKENS
   ============================================================ */
:root{
  --green:#58CC02;
  --green-hi:#61E002;
  --green-shadow:#46A302;
  --green-deep:#3F8A00;
  --green-tint:#D7FFB8;
  --green-bg:#F2FDE7;

  --blue:#1CB0F6;   --blue-shadow:#1899D6;  --blue-tint:#DDF4FF;
  --purple:#CE82FF; --purple-shadow:#A560CC;--purple-tint:#F4E6FF;
  --orange:#FF9600; --orange-shadow:#E08600;--orange-tint:#FFF1DA;
  --red:#FF4B4B;    --red-shadow:#E03E3E;   --red-tint:#FFE0E0;
  --yellow:#FFC800; --yellow-shadow:#E0A800;--yellow-tint:#FFF5CC;
  --teal:#00CD9C;   --teal-shadow:#00A87F;  --teal-tint:#D6FBF1;

  --ink:#3C3C3C;
  --ink-2:#737373;
  --ink-3:#AFAFAF;
  --line:#E5E5E5;
  --line-2:#F2F2F2;
  --bg:#FFFFFF;
  --bg-2:#F7F7F7;

  --r-sm:12px;
  --r:16px;
  --r-lg:24px;
  --r-xl:32px;

  --shadow-card:0 2px 0 var(--line);
  --font:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img,svg{display:block;max-width:100%;}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;
  border-radius:var(--r);padding:14px 26px;
  background:var(--green);color:#fff;
  box-shadow:0 4px 0 var(--green-shadow);
  transition:filter .12s ease, transform .07s ease, box-shadow .07s ease;
  user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;
  text-decoration:none;
}
.btn:hover{filter:brightness(1.07);}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-shadow);}
.btn:disabled,.btn[aria-disabled="true"]{
  background:var(--line);color:var(--ink-3);box-shadow:0 4px 0 #D8D8D8;
  cursor:not-allowed;filter:none;transform:none;pointer-events:none;
}
.btn--blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-shadow);}
.btn--blue:active{box-shadow:0 0 0 var(--blue-shadow);}
.btn--purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-shadow);}
.btn--purple:active{box-shadow:0 0 0 var(--purple-shadow);}
.btn--orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-shadow);}
.btn--orange:active{box-shadow:0 0 0 var(--orange-shadow);}
.btn--red{background:var(--red);box-shadow:0 4px 0 var(--red-shadow);}
.btn--red:active{box-shadow:0 0 0 var(--red-shadow);}
.btn--ghost{
  background:#fff;color:var(--green);border:2px solid var(--line);
  box-shadow:0 4px 0 var(--line);
}
.btn--ghost:active{box-shadow:0 0 0 var(--line);}
.btn--ghost-blue{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);}
.btn--ghost-blue:active{box-shadow:0 0 0 var(--line);}
.btn--ghost-red{background:#fff;color:var(--red);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);}
.btn--ghost-red:active{box-shadow:0 0 0 var(--line);}
.btn--sm{padding:10px 18px;font-size:13px;border-radius:12px;}
.btn--lg{padding:18px 34px;font-size:17px;border-radius:18px;}
.btn--block{width:100%;}
.btn--flat{box-shadow:none;}
.btn--flat:active{transform:none;box-shadow:none;}

.icon-btn{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink-3);font-size:20px;font-weight:800;
  transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--line-2);color:var(--ink);}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{display:none;}
#app.on{display:block;}
.shell{display:flex;min-height:100vh;}

.sidebar{
  width:252px;flex:0 0 252px;border-right:2px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;background:#fff;z-index:20;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:6px 12px 22px;
  font-weight:900;font-size:26px;letter-spacing:-.5px;color:var(--green);
}
.brand .brand-mark{
  width:34px;height:34px;border-radius:11px;background:var(--green);
  display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900;
  box-shadow:0 3px 0 var(--green-shadow);
}
.nav-item{
  display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;
  font-weight:800;font-size:14px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--ink-2);border:2px solid transparent;transition:all .14s;width:100%;
  text-align:left;margin-bottom:4px;
}
.nav-item svg{width:26px;height:26px;stroke-width:2.4;flex:0 0 26px;}
.nav-item:hover{background:var(--bg-2);color:var(--ink);}
.nav-item.active{
  background:var(--green-tint);color:var(--green-deep);border-color:var(--green-tint);
}
.nav-item.active svg{stroke:var(--green-deep);}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:2px solid var(--line-2);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-bottom:2px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:10px;
}
.topbar-spacer{flex:1;}
.stat-pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;
  font-weight:900;font-size:14px;background:var(--bg-2);color:var(--ink);
  transition:transform .2s;
}
.stat-pill.fire{color:#FF9600;background:var(--orange-tint);}
.stat-pill.xp{color:var(--green-deep);background:var(--green-bg);}
.stat-pill.heart{color:var(--red);background:var(--red-tint);}
.stat-pill.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1);}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}

.view{flex:1;padding:26px 22px 60px;max-width:1000px;width:100%;margin:0 auto;}
.view--narrow{max-width:720px;}

.bottom-nav{display:none;}

/* ============================================================
   CARDS & COMMON
   ============================================================ */
.card{
  background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--shadow-card);
}
.card--flat{box-shadow:none;}
.card--green{background:var(--green-bg);border-color:var(--green-tint);}
.card--tint{background:var(--bg-2);border-color:var(--line-2);}

.section-title{
  font-size:20px;font-weight:900;letter-spacing:-.2px;margin:30px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.section-title:first-child{margin-top:0;}
.page-title{font-size:32px;font-weight:900;letter-spacing:-.8px;line-height:1.15;}
.page-sub{color:var(--ink-2);font-weight:600;font-size:16px;margin-top:6px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

.progress-track{height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
.progress-fill{
  height:100%;background:var(--green);border-radius:99px;
  transition:width .7s cubic-bezier(.2,.9,.2,1);
}
.progress-fill.blue{background:var(--blue);}
.progress-fill.purple{background:var(--purple);}
.progress-fill.orange{background:var(--orange);}

.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
  font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
  background:var(--bg-2);color:var(--ink-2);
}
.badge.green{background:var(--green-tint);color:var(--green-deep);}
.badge.blue{background:var(--blue-tint);color:#0C7FB4;}
.badge.purple{background:var(--purple-tint);color:#8B4FB5;}
.badge.orange{background:var(--orange-tint);color:#B36B00;}
.badge.red{background:var(--red-tint);color:#C42B2B;}
.badge.yellow{background:var(--yellow-tint);color:#9C7A00;}

/* ============================================================
   LANDING
   ============================================================ */
.landing{min-height:100vh;display:flex;flex-direction:column;background:#fff;}
.landing-nav{
  display:flex;align-items:center;gap:16px;padding:18px 26px;max-width:1180px;
  width:100%;margin:0 auto;
}
.landing-hero{
  flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;
  max-width:1180px;width:100%;margin:0 auto;padding:20px 26px 60px;
}
.hero-title{
  font-size:clamp(38px,5.4vw,62px);font-weight:900;line-height:1.05;
  letter-spacing:-1.8px;
}
.hero-title .accent{color:var(--green);}
.hero-sub{font-size:19px;color:var(--ink-2);font-weight:600;margin-top:18px;max-width:520px;}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px;}
.hero-stats{display:flex;gap:28px;margin-top:38px;flex-wrap:wrap;}
.hero-stat b{display:block;font-size:26px;font-weight:900;color:var(--green);}
.hero-stat span{font-size:13px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;}

.hero-art{
  position:relative;display:grid;place-items:center;min-height:380px;
}
.hero-blob{
  position:absolute;width:min(420px,90%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--green-tint),var(--green-bg) 70%);
  animation:blobPulse 7s ease-in-out infinite;
}
@keyframes blobPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.hero-card-stack{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;width:min(340px,90%);}
.float-card{
  background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px;
  box-shadow:0 6px 0 var(--line);display:flex;align-items:center;gap:14px;
  animation:floaty 4.5s ease-in-out infinite;
}
.float-card:nth-child(2){animation-delay:.7s;margin-left:34px;}
.float-card:nth-child(3){animation-delay:1.4s;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.float-emoji{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:0 0 46px;
}
.float-card b{display:block;font-size:15px;font-weight:900;}
.float-card small{color:var(--ink-3);font-weight:700;font-size:12.5px;}

.landing-features{
  max-width:1180px;width:100%;margin:0 auto;padding:0 26px 70px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;
}
.feature{padding:24px;border-radius:24px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);}
.feature .f-ico{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:14px;
}
.feature h3{font-size:17px;font-weight:900;margin-bottom:6px;}
.feature p{color:var(--ink-2);font-weight:600;font-size:14.5px;}

/* ============================================================
   AUTH
   ============================================================ */
.auth-wrap{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(170deg,var(--green-bg),#fff 55%);
}
.auth-card{
  width:100%;max-width:440px;background:#fff;border:2px solid var(--line);
  border-radius:28px;padding:34px;box-shadow:0 6px 0 var(--line);
}
.auth-card h1{font-size:27px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;}
.auth-card p.lead{color:var(--ink-2);font-weight:600;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12.5px;font-weight:900;text-transform:uppercase;
  letter-spacing:.9px;color:var(--ink-2);margin-bottom:7px;
}
.input,.textarea{
  width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;
  background:var(--bg-2);font-weight:700;font-size:15.5px;transition:all .15s;
  resize:vertical;
}
.input:focus,.textarea:focus{
  outline:none;border-color:var(--green);background:#fff;
  box-shadow:0 0 0 4px var(--green-tint);
}
.textarea{min-height:130px;line-height:1.55;}

.divider{display:flex;align-items:center;gap:14px;color:var(--ink-3);font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:1px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:2px;background:var(--line-2);}

/* ============================================================
   AVATAR PICKER
   ============================================================ */
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;}
.avatar-opt{
  aspect-ratio:1;border-radius:18px;border:2px solid var(--line);background:var(--bg-2);
  font-size:30px;display:grid;place-items:center;transition:all .15s;
}
.avatar-opt:hover{transform:translateY(-3px);border-color:var(--green-tint);}
.avatar-opt.sel{
  border-color:var(--green);background:var(--green-tint);
  box-shadow:0 0 0 4px var(--green-tint);
}

/* ============================================================
   OPTION LIST (mind questions, level select, interest)
   ============================================================ */
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;border:2px solid var(--line);border-bottom-width:4px;
  border-radius:16px;background:#fff;font-weight:800;font-size:15.5px;
  transition:all .13s;margin-bottom:11px;color:var(--ink);
}
.opt:hover{background:var(--bg-2);}
.opt.sel{border-color:var(--green);background:var(--green-bg);color:var(--green-deep);}
.opt .opt-emoji{font-size:24px;}
.opt .opt-check{
  margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:#fff;flex:0 0 24px;
}
.opt.sel .opt-check{background:var(--green);border-color:var(--green);}

/* ============================================================
   ONBOARDING / FULLSCREEN STAGES
   ============================================================ */
.full-root{display:none;}
.full-root.on{display:block;}
.stage{
  min-height:100vh;display:flex;flex-direction:column;
  background:#fff;
}
.stage-top{
  max-width:760px;width:100%;margin:0 auto;padding:20px 22px;
  display:flex;align-items:center;gap:16px;
}
.stage-progress{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
.stage-progress i{
  display:block;height:100%;background:var(--green);border-radius:99px;
  transition:width .5s cubic-bezier(.2,.9,.2,1);
}
.stage-body{flex:1;max-width:760px;width:100%;margin:0 auto;padding:10px 22px 40px;}
.stage-foot{
  max-width:760px;width:100%;margin:0 auto;padding:16px 22px 34px;
  border-top:2px solid var(--line-2);
}
.stage-title{font-size:clamp(26px,4vw,36px);font-weight:900;letter-spacing:-.8px;line-height:1.15;}
.stage-sub{color:var(--ink-2);font-weight:600;font-size:16.5px;margin-top:10px;}

/* ============================================================
   HOME
   ============================================================ */
.hero-greet{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.continue-card{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--green),#4CB800);
  border-radius:26px;padding:26px;color:#fff;box-shadow:0 6px 0 var(--green-shadow);
}
.continue-card .cc-emoji{
  width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:38px;flex:0 0 72px;
}
.continue-card h3{font-size:24px;font-weight:900;letter-spacing:-.5px;}
.continue-card p{font-weight:700;opacity:.95;}
.continue-card .cc-prog{
  flex:1;min-width:180px;height:14px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;
}
.continue-card .cc-prog i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .8s;}
.continue-card .btn{background:#fff;color:var(--green-deep);box-shadow:0 4px 0 rgba(0,0,0,.18);}
.continue-card .btn:active{box-shadow:0 0 0 rgba(0,0,0,.18);}

.ach-mini{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
  border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);min-width:0;
}
.ach-mini .am-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 44px;}
.ach-mini b{font-size:14px;font-weight:900;display:block;}
.ach-mini small{color:var(--ink-3);font-weight:700;font-size:12px;}

/* ============================================================
   ROADMAP
   ============================================================ */
.map-wrap{position:relative;width:100%;max-width:460px;margin:0 auto;}
.map-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.map-node{
  position:absolute;transform:translate(-50%,-50%);
  width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  font-size:32px;font-weight:900;border:none;background:none;padding:0;
  transition:transform .18s;
}
.map-node .node-inner{
  width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  border:4px solid transparent;font-size:32px;
  transition:all .22s;
}
.map-node.locked .node-inner{background:#E9E9E9;color:#B4B4B4;box-shadow:0 5px 0 #D2D2D2;}
.map-node.current .node-inner{
  background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-shadow);
  animation:bounceNode 2.2s ease-in-out infinite;
}
@keyframes bounceNode{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.map-node.done .node-inner{background:var(--yellow);color:#fff;box-shadow:0 6px 0 var(--yellow-shadow);}
.map-node:hover .node-inner{filter:brightness(1.06);}
.map-node:active{transform:translate(-50%,-50%) scale(.94);}
.map-node .node-ring{
  position:absolute;inset:-10px;border-radius:50%;border:4px dashed var(--green);
  opacity:.5;animation:spin 14s linear infinite;pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.map-node.unlocking .node-inner{animation:unlockPop .8s cubic-bezier(.3,1.6,.5,1);}
@keyframes unlockPop{0%{transform:scale(.4);opacity:.3;}60%{transform:scale(1.18);}100%{transform:scale(1);}}
.map-label{
  position:absolute;transform:translate(-50%,0);width:190px;text-align:center;
  font-weight:900;font-size:13.5px;color:var(--ink-2);pointer-events:none;
}
.map-label small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase;}

/* ============================================================
   LESSON (immersive)
   ============================================================ */
.lesson{min-height:100vh;display:flex;flex-direction:column;background:#fff;}
.lesson-top{
  display:flex;align-items:center;gap:16px;padding:16px 22px;
  max-width:820px;width:100%;margin:0 auto;
}
.lesson-bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
.lesson-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .55s cubic-bezier(.2,.9,.2,1);}
.energy-pill{
  display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;
  color:var(--red);background:var(--red-tint);padding:7px 14px;border-radius:99px;
}
.lesson-body{flex:1;max-width:820px;width:100%;margin:0 auto;padding:8px 22px 24px;}
.lesson-foot{max-width:820px;width:100%;margin:0 auto;padding:14px 22px 34px;}

.agent-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.agent-avatar{
  width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:31px;
  flex:0 0 62px;box-shadow:0 4px 0 rgba(0,0,0,.14);
}
.agent-head h2{font-size:23px;font-weight:900;letter-spacing:-.4px;line-height:1.1;}
.agent-head p{color:var(--ink-2);font-weight:700;font-size:14.5px;}

.bubble{
  background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 22px;
  box-shadow:0 4px 0 var(--line);margin-bottom:14px;
  animation:slideUp .35s cubic-bezier(.2,.9,.2,1) both;
}
.bubble h4{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.bubble p{font-weight:600;color:var(--ink-2);font-size:15.5px;line-height:1.62;}
.bubble .eg{
  margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--bg-2);
  font-weight:700;font-size:14.5px;color:var(--ink);border-left:5px solid var(--green);
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.stagger>*{animation:slideUp .4s cubic-bezier(.2,.9,.2,1) both;}
.stagger>*:nth-child(1){animation-delay:.02s;}
.stagger>*:nth-child(2){animation-delay:.1s;}
.stagger>*:nth-child(3){animation-delay:.18s;}
.stagger>*:nth-child(4){animation-delay:.26s;}
.stagger>*:nth-child(5){animation-delay:.34s;}

.feedback{
  border-radius:20px;padding:18px 20px;margin-top:16px;font-weight:700;
  animation:slideUp .3s cubic-bezier(.2,.9,.2,1) both;
}
.feedback.good{background:var(--green-bg);border:2px solid var(--green-tint);color:var(--green-deep);}
.feedback.bad{background:var(--red-tint);border:2px solid #FFC9C9;color:#B62B2B;}
.feedback h4{font-size:18px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.feedback p{font-weight:700;font-size:14.8px;line-height:1.6;color:inherit;opacity:.92;}

/* Quiz */
.quiz-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.timer{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;
  background:var(--blue-tint);color:#0C7FB4;font-weight:900;font-size:15px;
}
.timer.warn{background:var(--red-tint);color:#C42B2B;animation:pulseT 1s infinite;}
@keyframes pulseT{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.q-card{
  background:#fff;border:2px solid var(--line);border-radius:24px;padding:26px;
  box-shadow:0 4px 0 var(--line);font-size:20px;font-weight:800;line-height:1.45;
}
.choice{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:17px 20px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;
  background:#fff;font-weight:800;font-size:15.5px;margin-top:12px;transition:all .13s;
}
.choice:hover{background:var(--bg-2);}
.choice.sel{border-color:var(--blue);background:var(--blue-tint);color:#0C7FB4;}
.choice.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-deep);}
.choice.wrong{border-color:var(--red);background:var(--red-tint);color:#B62B2B;}
.choice .key{
  width:30px;height:30px;border-radius:9px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 30px;color:var(--ink-3);
}
.choice.sel .key{border-color:var(--blue);color:var(--blue);}

/* ============================================================
   REVIEW BARS
   ============================================================ */
.skill-row{margin-bottom:20px;}
.skill-row .sr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.skill-row .sr-top b{font-weight:900;font-size:15px;}
.skill-row .sr-top span{font-weight:900;font-size:14px;color:var(--ink-2);}
.skill-track{height:18px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;}
.skill-track i{
  display:block;height:100%;border-radius:99px;background:var(--green);
  transition:width 1s cubic-bezier(.2,.9,.2,1);
}
.skill-track::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 21px,rgba(255,255,255,.6) 21px 23px);
  pointer-events:none;opacity:.5;
}

/* ============================================================
   STATS
   ============================================================ */
.stat-card{
  border:2px solid var(--line);border-radius:20px;padding:18px;background:#fff;
  box-shadow:0 3px 0 var(--line);
}
.stat-card .sc-ico{font-size:24px;margin-bottom:8px;}
.stat-card b{display:block;font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.1;}
.stat-card span{font-size:12.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;}

/* Timeline */
.tl{position:relative;padding-left:30px;}
.tl::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:3px;background:var(--line-2);border-radius:9px;}
.tl-item{position:relative;padding:12px 0 14px;}
.tl-item::before{
  content:'';position:absolute;left:-27px;top:18px;width:15px;height:15px;border-radius:50%;
  background:var(--green);border:3px solid #fff;box-shadow:0 0 0 2px var(--green-tint);
}
.tl-item.pending::before{background:var(--line);box-shadow:0 0 0 2px var(--line-2);}
.tl-item b{font-weight:900;font-size:15px;}
.tl-item small{display:block;color:var(--ink-3);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px;}
.tl-xp{float:right;font-weight:900;color:var(--green);font-size:14px;}

/* Achievements */
.ach-card{
  border:2px solid var(--line);border-radius:22px;padding:20px;text-align:center;
  background:#fff;box-shadow:0 3px 0 var(--line);transition:transform .18s;
}
.ach-card:hover{transform:translateY(-4px);}
.ach-card.locked{opacity:.55;filter:grayscale(1);}
.ach-card .ac-ico{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  font-size:32px;margin:0 auto 12px;
}
.ach-card b{display:block;font-weight:900;font-size:15px;margin-bottom:4px;}
.ach-card small{color:var(--ink-3);font-weight:700;font-size:12.5px;line-height:1.4;display:block;}

/* ============================================================
   TOASTS & MODALS
   ============================================================ */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;
  display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:100%;padding:0 16px;}
.toast{
  background:var(--ink);color:#fff;font-weight:800;padding:13px 22px;border-radius:99px;
  box-shadow:0 8px 26px rgba(0,0,0,.22);animation:toastIn .32s cubic-bezier(.2,1.5,.5,1);
  font-size:14.5px;max-width:92vw;text-align:center;
}
.toast.green{background:var(--green);}
.toast.red{background:var(--red);}
.toast.blue{background:var(--blue);}
@keyframes toastIn{from{opacity:0;transform:translateY(-22px) scale(.9);}to{opacity:1;transform:none;}}

.modal-root{position:fixed;inset:0;z-index:900;display:none;}
.modal-root.on{display:grid;place-items:center;padding:20px;}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  position:relative;background:#fff;border-radius:28px;padding:30px;width:100%;max-width:460px;
  box-shadow:0 20px 60px rgba(0,0,0,.24);animation:modalIn .34s cubic-bezier(.2,1.4,.5,1);
  max-height:88vh;overflow-y:auto;
}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.95);}to{opacity:1;transform:none;}}
.modal h2{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px;}
.modal p{color:var(--ink-2);font-weight:600;margin-bottom:20px;}

.xp-burst{
  position:fixed;z-index:1000;font-weight:900;font-size:28px;color:var(--green);
  pointer-events:none;animation:xpUp 1.1s cubic-bezier(.2,.9,.2,1) forwards;
  text-shadow:0 2px 0 rgba(0,0,0,.08);
}
@keyframes xpUp{0%{opacity:0;transform:translateY(10px) scale(.7);}
  25%{opacity:1;transform:translateY(-10px) scale(1.12);}
  100%{opacity:0;transform:translateY(-70px) scale(1);}}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden;}
.confetti i{
  position:absolute;width:11px;height:16px;border-radius:3px;top:-24px;
  animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg);opacity:.85;}}

/* Celebration */
.celebrate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px 22px;background:linear-gradient(175deg,var(--green-bg),#fff 60%);
}
.celebrate h1{font-size:clamp(34px,7vw,54px);font-weight:900;letter-spacing:-1.6px;line-height:1.05;}
.celebrate .sub{font-size:18px;font-weight:700;color:var(--ink-2);margin-top:12px;}
.celebrate-badge{
  width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:62px;
  background:var(--yellow-tint);border:5px solid var(--yellow);margin:26px 0;
  box-shadow:0 8px 0 var(--yellow-shadow);animation:badgeIn .7s cubic-bezier(.2,1.6,.5,1);
}
@keyframes badgeIn{0%{transform:scale(0) rotate(-90deg);}70%{transform:scale(1.14) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
.celebrate-list{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0 28px;}
.celebrate-list div{
  background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 20px;
  box-shadow:0 3px 0 var(--line);min-width:130px;
}
.celebrate-list b{display:block;font-size:22px;font-weight:900;color:var(--green-deep);}
.celebrate-list span{font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;}

/* Empty state */
.empty{text-align:center;padding:56px 22px;}
.empty .e-ico{font-size:60px;margin-bottom:16px;opacity:.85;}
.empty h3{font-size:22px;font-weight:900;margin-bottom:8px;}
.empty p{color:var(--ink-2);font-weight:600;max-width:420px;margin:0 auto 22px;}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--line-2) 25%,#E9E9E9 50%,var(--line-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* CALA loader */
.cala-step{
  display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:18px;
  background:var(--bg-2);margin-bottom:12px;font-weight:800;opacity:.4;
  transition:all .4s;border:2px solid transparent;
}
.cala-step.active{opacity:1;background:var(--green-bg);border-color:var(--green-tint);transform:translateX(4px);}
.cala-step.done{opacity:1;background:#fff;border-color:var(--line);}
.cala-dot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 30px;
  background:var(--line);color:#fff;font-size:14px;font-weight:900;
}
.cala-step.done .cala-dot{background:var(--green);}
.cala-step.active .cala-dot{background:var(--blue);animation:pulseT 1s infinite;}
.spinner{
  width:34px;height:34px;border-radius:50%;border:4px solid var(--line);
  border-top-color:var(--green);animation:spin .8s linear infinite;
}

/* Streak week */
.week{display:flex;gap:8px;justify-content:space-between;}
.day{
  flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg-2);
  border:2px solid var(--line-2);
}
.day b{display:block;font-size:11.5px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;}
.day i{display:block;font-style:normal;font-size:20px;margin-top:5px;}
.day.done{background:var(--green-bg);border-color:var(--green-tint);}
.day.done b{color:var(--green-deep);}
.day.today{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint);}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{
  padding:10px 18px;border-radius:99px;font-weight:900;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.7px;background:var(--bg-2);color:var(--ink-2);
  border:2px solid transparent;transition:all .15s;
}
.tab.active{background:var(--green-tint);color:var(--green-deep);border-color:var(--green-tint);}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:2px solid var(--line-2);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .tr-txt{flex:1;}
.toggle-row b{display:block;font-weight:900;font-size:15px;}
.toggle-row small{color:var(--ink-3);font-weight:700;font-size:13px;}
.switch{
  width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;
  transition:background .2s;flex:0 0 56px;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;transition:transform .22s cubic-bezier(.2,1.4,.5,1);box-shadow:0 2px 5px rgba(0,0,0,.2);
}
.switch.on{background:var(--green);}
.switch.on::after{transform:translateX(24px);}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:980px){
  .landing-hero{grid-template-columns:1fr;text-align:center;}
  .hero-sub{margin-left:auto;margin-right:auto;}
  .hero-cta,.hero-stats{justify-content:center;}
  .hero-art{min-height:320px;order:-1;}
}
@media (max-width:860px){
  .sidebar{display:none;}
  .view{padding:18px 16px 104px;}
  .topbar{padding:10px 14px;gap:8px;}
  .stat-pill{padding:6px 11px;font-size:13px;}
  .stat-pill .lbl{display:none;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;
    border-top:2px solid var(--line);z-index:60;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-nav .nav-item{
    flex-direction:column;gap:3px;padding:6px 2px;font-size:10px;margin:0;
    text-align:center;letter-spacing:.4px;border-radius:12px;justify-content:center;
  }
  .bottom-nav .nav-item svg{width:24px;height:24px;flex:none;}
  .bottom-nav .nav-item.active{background:transparent;color:var(--green);}
  .continue-card{padding:20px;gap:16px;}
  .continue-card h3{font-size:20px;}
  .continue-card .cc-emoji{width:56px;height:56px;flex:0 0 56px;font-size:28px;}
  .continue-card .btn{width:100%;}
  .page-title{font-size:26px;}
  .stage-body{padding:10px 16px 30px;}
  .stage-top,.stage-foot{padding-left:16px;padding-right:16px;}
  .lesson-body{padding:8px 16px 20px;}
  .lesson-foot{padding:12px 16px calc(20px + env(safe-area-inset-bottom));}
  .lesson-top{padding:12px 16px;}
  .q-card{font-size:18px;padding:20px;}
  .modal{padding:24px;border-radius:24px;}
  .celebrate-list div{min-width:104px;padding:12px 14px;}
}
@media (max-width:520px){
  .hero-title{letter-spacing:-1px;}
  .landing-features{padding:0 16px 50px;}
  .landing-hero{padding:10px 16px 40px;}
  .landing-nav{padding:16px;}
  .btn{padding:13px 20px;font-size:14px;}
  .btn--lg{padding:16px 26px;font-size:15.5px;}
  .card{padding:18px;}
  .week{gap:5px;}
  .day{padding:8px 2px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

<script>
/* ============================================================
   CLARIO — APPLICATION SCRIPT
   ============================================================ */

/* ---------------- Utilities ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

};

/* ---------------- Achievements ---------------- */
const ACHIEVEMENTS = [
  { id:'first_step',   icon:'👣', name:'First Step',        desc:'Complete your first level.',            color:'green'  },
  { id:'deep_thinker', icon:'🧠', name:'Deep Thinker',      desc:'Complete 5 critical-thinking challenges.', color:'purple' },
  { id:'real_world',   icon:'🌍', name:'Real-World Solver', desc:'Complete 5 practical challenges.',      color:'orange' },
  { id:'quiz_master',  icon:'🏆', name:'Quiz Master',       desc:'Score 90%+ on a Zayn assessment.',      color:'yellow' },
  { id:'comeback',     icon:'💪', name:'Comeback',          desc:'Improve a weak concept after remediation.', color:'red' },

  { id:'xp_collector', icon:'⭐', name:'XP Collector',      desc:'Earn 1,000 XP in total.',               color:'green'  }
];

/* ---------------- Agents ---------------- */
const AGENTS = {
  nova:  { name:'Nova',  role:'Research Companion', emoji:'🔭', color:'blue',   tint:'var(--blue-tint)',   shadow:'var(--blue-shadow)' },
  mira:  { name:'Mira',  role:'Teaching Companion', emoji:'💡', color:'green',  tint:'var(--green-tint)',  shadow:'var(--green-shadow)' },
  ayan:  { name:'Ayan',  role:'Thinking Companion', emoji:'🧠', color:'purple', tint:'var(--purple-tint)', shadow:'var(--purple-shadow)' },
  kira:  { name:'Kira',  role:'Practice Companion', emoji:'🛠️', color:'orange', tint:'var(--orange-tint)', shadow:'var(--orange-shadow)' },
  zayn:  { name:'Zayn',  role:'Challenge Companion',emoji:'⚡', color:'yellow', tint:'var(--yellow-tint)', shadow:'var(--yellow-shadow)' },

function levelTitlesFor(topic) {
  const t = (topic || '').toLowerCase();
  if (/data science|data analysis|analytics|data/.test(t))
    return ['Foundations', 'Understanding Data', 'Data Cleaning', 'Feature Preparation', 'Data Preprocessing'];
  if (/python/.test(t))
    return ['Syntax Basics', 'Variables & Types', 'Control Flow', 'Functions', 'Working with Data'];
  if (/machine learning|deep learning|\bml\b|neural|\bai\b/.test(t))
    return ['Foundations', 'Data & Features', 'Model Basics', 'Training & Evaluation', 'Putting Models to Work'];
  if (/javascript|web dev|react|html|css|frontend/.test(t))
    return ['Syntax & Values', 'Functions', 'Objects & Arrays', 'The DOM', 'Async Patterns'];
  if (/design|ux|ui|figma/.test(t))
    return ['Design Foundations', 'User Research', 'Layout & Hierarchy', 'Interaction Design', 'Design Systems'];
  if (/marketing|business|finance|product|startup/.test(t))
    return ['Foundations', 'The Customer', 'Channels & Metrics', 'Strategy in Practice', 'Scaling What Works'];
  if (/spanish|french|german|japanese|language|english/.test(t))
    return ['First Words', 'Everyday Phrases', 'Building Sentences', 'Real Conversations', 'Fluent Thinking'];
  if (/physics|chemistry|biology|math|calculus|algebra|statistics/.test(t))
    return ['Core Foundations', 'Key Principles', 'Working Through Problems', 'Applied Reasoning', 'Advanced Mastery'];
  return ['Foundations', 'Core Concepts', 'Practical Skills', 'Real-World Application', 'Mastery'];
}

function iconFor(topic) {
  const t = (topic || '').toLowerCase();
  if (/data|analytics|statistic/.test(t)) return '📊';
  if (/python|code|programming|software|javascript|web|react/.test(t)) return '💻';
  if (/machine learning|deep learning|neural|\bai\b|\bml\b/.test(t)) return '🤖';
  if (/design|ux|ui/.test(t)) return '🎨';
  if (/marketing|business|finance|product/.test(t)) return '📈';
  if (/physics|chemistry|biology|science/.test(t)) return '🔬';
  if (/math|calculus|algebra/.test(t)) return '➗';
  if (/language|spanish|french|german|japanese/.test(t)) return '🗣️';
  if (/history/.test(t)) return '📜';
  if (/music|guitar|piano/.test(t)) return '🎵';
  if (/cook|baking/.test(t)) return '🍳';
  if (/photo/.test(t)) return '📷';
  return '📚';
}

const PALETTE = ['green', 'blue', 'purple', 'orange', 'teal', 'red'];

function genContent(journey, level) {
  const T = journey.title;
  const L = level.title;
  const K = L.toLowerCase();
  const interest = journey.interest || 'Real life';

  /* ---------- NOVA ---------- */
  const nova = {
    headline: `Research brief — ${L}`,
    intro: `Before you dive in, here's the 60-second picture of what ${L} actually covers inside ${T}.`,
    points: [
      `${L} is one of the load-bearing ideas in ${T}. Almost everything later in this journey sits on top of it.`,
      `Most learners rush past this part and then get stuck three levels later — the confusion almost always traces back here.`,
      `You'll meet ${K} whenever you have to make a decision you can actually defend, not just guess.`
    ],
    insight: `Key insight: ${L} isn't a list of facts to memorise. It's a way of thinking you'll reuse every single level after this one.`,
    source: `Synthesised from 14 learning sources · adapted to your ${interest.toLowerCase()} interest`
  };

  /* ---------- MIRA ---------- */
  const mira = [
    {
      heading: 'The simple idea',
      body: `${L} is how you take something messy and turn it into something you can actually reason about. In ${T}, that means you stop guessing and start working with clear, checkable pieces.`,
      example: `Think of it like tidying a desk before starting work. You don't do the work on the tidy desk — you just make the work possible.`
    },
    {
      heading: 'A concrete example',
      body: `Imagine you're handed a ${T.toLowerCase()} problem with almost no structure. The first move isn't to solve it — it's to name what you have, name what you want, and find the gap between them.`,
      example: `"I have 200 messy records and I need one reliable answer." The gap between those two sentences is exactly where ${L} lives.`
    },
    {
      heading: 'Try this',
      body: `Before you move on, say ${L} out loud in your own words — one sentence, no jargon. If you can't, that's useful information: it tells you exactly where to slow down.`,
      example: `If your sentence includes the word "basically" twice, you probably haven't landed it yet.`
    }
  ];

  /* ---------- AYAN ---------- */
  const ayan = {
    question: `Why do you think ${L} has to come before the harder parts of ${T}?`,
    hint: `Think about what would break if you skipped it entirely.`,
    model: `${L} builds the mental model that everything after it depends on. If you skip it, later material doesn't fail loudly — it fails quietly. You'll follow the steps but not know why they work, and the moment a problem looks slightly different, you'll be stuck. Learning it now means every later level costs you less effort, not more.`,
    keywords: ['foundation','base','build','later','depend','because','stuck','understand','why','support','model','structure']
  };

  /* ---------- KIRA ---------- */
  const kira = {
    scenario: `You're two weeks into a real ${T} project. A teammate hands you something half-finished and says: "Can you just make this work?"`,
    challenge: `Using ${L}, describe your first three moves — and say what you would NOT do.`,
    model: `First, I'd name what I actually have: what's complete, what's missing, what's unclear. Second, I'd write one sentence describing what "work" means here, so we're solving the same problem. Third, I'd pick the smallest piece I can fully verify and fix that first. What I would NOT do is start editing randomly to see what happens — that hides the real problem and makes it harder to find later.`,
    keywords: ['first','then','next','check','understand','small','verify','not','avoid','ask','clarify','step']
  };

  /* ---------- ZAYN ---------- */
  const quiz = [
    { diff:'easy', type:'mc', q:`Which statement best describes ${L}?`,
      opts:[
        `A core part of ${T} that every later level builds on.`,
        `An optional extra you can safely skip.`,
        `A memory test with no practical use.`,
        `Something only experts ever need.`
      ], answer:0,
      explain:`${L} is foundational — later levels assume you have it.` },

    { diff:'easy', type:'text', q:`Fill in the blank: Before moving on, you should be able to ______ ${L} in your own words.`,
      keywords:['explain','describe','summar','teach','say','tell','state'], placeholder:'Type one word…',
      explain:`If you can't say it simply, you haven't finished learning it yet.` },

    { diff:'easy', type:'mc', q:`Which of these is a real sign you've understood ${L}?`,
      opts:[
        `You can use it in a situation you haven't seen before.`,
        `You memorised the exact wording of the definition.`,
        `You finished watching the lesson.`,
        `You highlighted the whole page.`
      ], answer:0,
      explain:`Transfer to a new situation is the real test of understanding.` },

    { diff:'easy', type:'text', q:`In one or two words, what's the main goal of ${L}?`,
      keywords:['understand','clarity','apply','master','learn','know','build','organ','structure','use'],
      placeholder:'One or two words…',
      explain:`The goal is usable clarity — not coverage.` },

    { diff:'easy', type:'mc', q:`What's the most common mistake learners make with ${L}?`,
      opts:[
        `Skipping the "why" and jumping straight to the "how".`,
        `Practising too many examples.`,
        `Asking questions too early.`,
        `Reviewing their notes too often.`
      ], answer:0,
      explain:`Steps without reasoning collapse the moment the problem changes shape.` },

    { diff:'medium', type:'mc', q:`You're stuck on a real ${T} problem. What's the best first move?`,
      opts:[
        `Break it into the smallest piece you can already explain.`,
        `Restart the entire course from the beginning.`,
        `Copy a solution you found online.`,
        `Skip it and hope it isn't important.`
      ], answer:0,
      explain:`Shrinking the problem is almost always faster than restarting.` },

    { diff:'medium', type:'text', q:`Explain in your own words why ${L} matters inside ${T}.`,
      keywords:['because','so that','helps','allows','enables','foundation','build','understand','later','support'],
      placeholder:'Write 1–2 sentences…', minWords:6,
      explain:`Strong answers connect ${L} to something you'll do later, not just describe it.` },

    { diff:'medium', type:'mc', q:`Which is the better way to practise ${L}?`,
      opts:[
        `Alternate between a small idea and applying it immediately.`,
        `Read everything once, then never return to it.`,
        `Only study the parts you already find easy.`,
        `Wait until you feel completely ready.`
      ], answer:0,
      explain:`Tight study–apply loops beat long passive reading every time.` },

    { diff:'hard', type:'text', q:`A colleague says: "${L} is just theory — I'll skip it." Write a two-sentence response.`,
      keywords:['risk','mistake','foundation','build','later','problem','understand','why','apply','fail','cost','break'],
      placeholder:'Two sentences…', minWords:10,
      explain:`The strongest responses name a concrete cost of skipping it, not just an opinion.` },

    { diff:'hard', type:'text', q:`Design a tiny 3-step plan to practise ${L} this week.`,
      keywords:['first','then','next','step','practice','apply','review','day','minute','build','small'],
      placeholder:'Step 1… Step 2… Step 3…', minWords:10,
      explain:`Specific, small, and scheduled beats ambitious and vague.` }
  ];

  return { nova, mira, ayan, kira, quiz };
}

function gradeTyped(q, text) {
  const t = (text || '').toLowerCase().trim();
  const words = t.split(/\s+/).filter(Boolean);
  const minWords = q.minWords || 1;
  if (words.length < minWords && words.length < 2) return false;
  if (q.keywords && q.keywords.some(k => t.includes(k))) return true;
  return words.length >= (minWords || 4);
}

function createJourney(title, goal, level, interest) {
  const titles = levelTitlesFor(title);
  const color = PALETTE[S.journeys.length % PALETTE.length];
  const journey = {
    id: uid(),
    title: title.trim(),
    goal: goal.trim(),
    startLevel: level,
    interest: interest,
    icon: iconFor(title),
    color,
    createdAt: Date.now(),
    levels: titles.map((t, i) => ({
      idx: i,
      title: t,
      desc: levelDesc(t, title),
      xp: 100 + i * 25,
      difficulty: ['Beginner', 'Beginner', 'Intermediate', 'Intermediate', 'Advanced'][i],
      status: i === 0 ? 'current' : 'locked',
      progress: 0,
      mastery: 0,
      content: null,
      attempts: 0
    }))
  };
  S.journeys.push(journey);
  S.activeJourneyId = journey.id;
  save();
  return journey;
}

function levelDesc(t, topic) {
  const map = {
    'Foundations': `The core vocabulary and mental model behind ${topic}.`,
    'Understanding Data': `How data is represented, read, and interpreted.`,
    'Data Cleaning': `Turning messy input into something you can trust.`,
    'Feature Preparation': `Shaping what you have so the next step works.`,
    'Data Preprocessing': `The complete pipeline, end to end.`,
    'Core Concepts': `The handful of ideas everything else hangs from.`,
    'Practical Skills': `What it looks like when you actually use it.`,
    'Real-World Application': `Applying it to messy, real situations.`,
    'Mastery': `Putting it all together without hand-holding.`
  };
  return map[t] || `Build real ability in ${t.toLowerCase()} — then prove it.`;
}

function getJourney(id) { return S.journeys.find(j => j.id === id) || null; }
function activeJourney() { return getJourney(S.activeJourneyId) || S.journeys[0] || null; }
function currentLevel(j) { return j ? j.levels.find(l => l.status === 'current') : null; }

   TOASTS / MODALS / EFFECTS
   ============================================================ */
function toast(msg, kind = '', ms = 2400) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .3s, transform .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(-14px)';
    setTimeout(() => t.remove(), 320);
  }, ms);
}

function openModal(html, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="modal-bg" ${opts.dismissible === false ? '' : 'data-close="1"'}></div><div class="modal">${html}</div>`;
  root.classList.add('on');
  if (opts.dismissible !== false) {
    $('.modal-bg', root).onclick = closeModal;
  }
}
function closeModal() {
  $('#modal').classList.remove('on');
  $('#modal').innerHTML = '';
}
window.closeModal = closeModal;

function xpBurst(amount, x, y) {
  const el = document.createElement('div');
  el.className = 'xp-burst';
  el.textContent = `+${amount} XP`;
  el.style.left = (x || window.innerWidth / 2 - 40) + 'px';
  el.style.top = (y || 120) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function confetti(n = 70) {
  const colors = ['#58CC02', '#1CB0F6', '#FFC800', '#CE82FF', '#FF9600', '#FF4B4B', '#00CD9C'];
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[rnd(0, colors.length - 1)];
    c.style.animationDuration = (1.9 + Math.random() * 1.7) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.transform = `rotate(${rnd(0, 360)}deg)`;
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 4200);
}

function addXP(n, silent) {
  S.xp += n;
  S.todayXP += n;
  if (!silent) {
    const pill = $('#xpPill');
    if (pill) { pill.classList.add('pop'); setTimeout(() => pill.classList.remove('pop'), 460); }
  }
  if (S.xp >= 1000) unlock('xp_collector');
  checkDailyGoal();
  save();
  refreshTopbar();
}

function checkDailyGoal() {
  if (S.todayXP >= S.dailyGoal && !S._goalCelebrated) {
    S._goalCelebrated = true;
    save();
    setTimeout(() => App.go('goalComplete'), 700);
  }
}

function unlock(id) {
  if (S.achievements[id]) return;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  S.achievements[id] = Date.now();
  save();
  const colors = { green:'var(--green-tint)', blue:'var(--blue-tint)', purple:'var(--purple-tint)',
                   orange:'var(--orange-tint)', yellow:'var(--yellow-tint)', red:'var(--red-tint)', teal:'var(--teal-tint)' };
  openModal(`
    <div style="text-align:center">
      <div style="width:104px;height:104px;border-radius:28px;display:grid;place-items:center;
        font-size:52px;margin:0 auto 18px;background:${colors[a.color]};
        animation:badgeIn .7s cubic-bezier(.2,1.6,.5,1)">${a.icon}</div>
      <div class="badge green" style="margin-bottom:10px">Achievement unlocked</div>
      <h2>${a.name}</h2>
      <p>${a.desc}</p>
      <button class="btn btn--block" onclick="closeModal()">Nice!</button>
    </div>
  `);
  confetti(40);
}

  if (def.full) {
    $('#app').classList.remove('on');
    $('#full').classList.add('on');

    renderTopbar();

SCREENS.cala = {
  full: true,
  render(p) {
    const steps = [
      'Reading your goal',
      'Mapping the skill tree',
      'Choosing your entry point',
      'Adapting to your mind profile',
      'Building your roadmap'
    ];
    return `
    <div class="stage">
      <div class="stage-body" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding-bottom:60px">
        <div style="text-align:center;margin-bottom:36px">
          <div class="spinner" style="margin:0 auto 22px"></div>
          <h1 class="stage-title">CLARIO is building your journey</h1>
          <p class="stage-sub">This takes a few seconds. It's doing a lot underneath.</p>
        </div>
        <div id="calaSteps">
          ${steps.map((s, i) => `
            <div class="cala-step" id="cala${i}">
              <div class="cala-dot">${i + 1}</div>
              <div style="flex:1;font-weight:800">${s}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  },
  after(p) {
    const steps = 5;
    let i = 0;
    const advance = () => {
      if (i > 0) {
        const prev = $('#cala' + (i - 1));
        if (prev) { prev.classList.remove('active'); prev.classList.add('done'); $('.cala-dot', prev).textContent = '✓'; }
      }
      if (i < steps) {
        const cur = $('#cala' + i);
        if (cur) cur.classList.add('active');
        i++;
        setTimeout(advance, 700 + Math.random() * 400);
      } else {
        const d = p.draft;
        const j = createJourney(d.task, d.goal, d.level, d.interest);

const DIFF_XP = { easy: 10, medium: 20, hard: 30 };

function renderZayn(quiz, L) {
  const q = L.quiz;
  const cur = quiz[q.i];
  if (!cur) return '<div class="empty"><h3>Quiz complete</h3></div>';

  const diffLabel = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[cur.diff];
  const diffClass = { easy: 'green', medium: 'orange', hard: 'red' }[cur.diff];
  const totalXP = DIFF_XP[cur.diff];

  let body = '';
  if (!q.answered) {
    if (cur.type === 'mc') {
      body = cur.opts.map((o, k) => `
        <button class="choice ${q.picked === k ? 'sel' : ''}" onclick="zaynPick(${k})">
          <span class="key">${'ABCD'[k]}</span><span>${esc(o)}</span>
        </button>`).join('');
    } else {
      body = `<textarea class="textarea" id="zaynInput" placeholder="${esc(cur.placeholder || 'Type your answer…')}">${esc(q.typed || '')}</textarea>`;
    }
  } else {
    if (cur.type === 'mc') {
      body = cur.opts.map((o, k) => {
        let cls = 'choice';
        if (k === cur.answer) cls += ' correct';
        else if (k === q.picked) cls += ' wrong';
        return `<div class="${cls}"><span class="key">${'ABCD'[k]}</span><span>${esc(o)}</span></div>`;
      }).join('');
    } else {
      body = `<div class="bubble" style="animation:none">
        <h4>Your answer</h4>
        <p style="color:var(--ink);font-weight:700">${esc(q.typed || '(blank)')}</p>
      </div>`;
    }
  }

  const correct = q.answered ? q.lastCorrect : false;

  return `
    ${agentHead('zayn', 'Let\'s see what stuck.')}
    <div class="quiz-hud">
      <span class="badge">Question ${q.i + 1} / ${quiz.length}</span>
      <span class="badge ${diffClass}">${diffLabel}</span>
      ${!q.answered ? `<span class="timer ${q.timeLeft <= 10 ? 'warn' : ''}" id="quizTimer">⏱ ${fmtTime(q.timeLeft)}</span>` : ''}
      <span style="flex:1"></span>
      <span class="badge green">⭐ ${S.xp} XP</span>
    </div>

    <div class="progress-track" style="margin-bottom:20px;height:10px">
      <div class="progress-fill blue" style="width:${Math.round((q.i / quiz.length) * 100)}%"></div>
    </div>

    <div class="q-card">${esc(cur.q)}</div>
    <div style="margin-top:16px">${body}</div>

    ${q.answered ? `
      <div class="feedback ${correct ? 'good' : 'bad'}">
        <h4>${correct ? '✅ Nice! You got it.' : '💙 Almost. Let\'s look at this again.'}</h4>
        <p>${esc(cur.explain)}</p>
      </div>` : ''}

    <div class="lesson-foot" style="padding-left:0;padding-right:0;max-width:none">
      ${!q.answered
        ? `<button class="btn btn--lg btn--block" id="zaynSubmit" onclick="zaynSubmit()"
             ${cur.type === 'mc' && q.picked == null ? 'disabled aria-disabled="true"' : ''}>Submit</button>`
        : `<button class="btn btn--lg btn--block" onclick="zaynNext()">${q.i + 1 < quiz.length ? 'Next question →' : 'See my review →'}</button>`}
    </div>
  `;
}

function fmtTime(s) {
  const m = Math.floor(s / 60), ss = s % 60;
  return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}

SCREENS.lesson.after = function () {
  const L = App.lesson;
  if (!L || L.stage !== 'zayn') return;
  const q = L.quiz;
  const quiz = getJourney(L.jid).levels[L.idx].content.quiz;
  const cur = quiz[q.i];
  if (!cur || q.answered) { stopQuizTimer(); return; }

  const inp = $('#zaynInput');
  if (inp) {
    inp.oninput = () => {
      const b = $('#zaynSubmit');
      if (b) {
        const has = inp.value.trim().length > 1;
        b.disabled = !has;
        b.setAttribute('aria-disabled', String(!has));
      }
    };
  }

  stopQuizTimer();
  q.timeLeft = DIFF_TIME[cur.diff];
  const el = $('#quizTimer');
  if (el) el.textContent = '⏱ ' + fmtTime(q.timeLeft);

  q.timer = setInterval(() => {
    q.timeLeft--;
    const e = $('#quizTimer');
    if (e) {
      e.textContent = '⏱ ' + fmtTime(Math.max(0, q.timeLeft));
      e.classList.toggle('warn', q.timeLeft <= 10);
    }
    if (q.timeLeft <= 0) {
      stopQuizTimer();
      if (!q.answered) {
        toast('Time\'s up — let\'s look at it together', 'blue');
        zaynSubmit(true);
      }
    }
  }, 1000);
};

function zaynPick(k) {

  L.quiz.picked = k;

function zaynSubmit(timedOut) {
  const L = App.lesson;
  const q = L.quiz;
  const quiz = getJourney(L.jid).levels[L.idx].content.quiz;
  const cur = quiz[q.i];
  if (q.answered) return;

  let ok = false;
  if (cur.type === 'mc') {
    ok = !timedOut && q.picked === cur.answer;
  } else {
    const inp = $('#zaynInput');
    q.typed = inp ? inp.value : q.typed;
    ok = !timedOut && gradeTyped(cur, q.typed);
  }

  q.answered = true;
  q.lastCorrect = ok;
  stopQuizTimer();

  if (ok) {
    q.correct++;
    const xp = DIFF_XP[cur.diff];
    addXP(xp);
    xpBurst(xp);
    S.streak = Math.max(S.streak, 1);
  } else {
    q.wrong++;
    S.energy = Math.max(0, S.energy - 1);
    save();
    if (q.wrong === 2 && !q.interventionShown) {
      q.interventionShown = true;
      setTimeout(clarioIntervention, 900);
    }
  }
  render();

  if (S.energy <= 0) {
    setTimeout(energyEmpty, 700);
  }
}

function zaynNext() {
  const L = App.lesson;

  const quiz = getJourney(L.jid).levels[L.idx].content.quiz;
  if (q.i + 1 < quiz.length) {
    q.i++;

/* ---------- ELARA ---------- */
function computeResults(L) {
  const q = L.quiz;
  const quiz = getJourney(L.jid).levels[L.idx].content.quiz;
  const total = quiz.length;
  const accuracy = q.correct / total;

  const understanding = clamp(Math.round(accuracy * 100 * 0.9 + 18 + rnd(-3, 5)), 35, 99);
  const reasoning     = clamp(Math.round(accuracy * 100 * 0.8 + 22 + rnd(-4, 6)), 35, 99);
  const application   = clamp(Math.round(accuracy * 100 * 0.85 + 20 + rnd(-3, 6)), 35, 99);
  const assessment    = clamp(Math.round(accuracy * 100), 20, 100);
  const overall = Math.round((understanding + reasoning + application + assessment) / 4);

  return { understanding, reasoning, application, assessment, overall, accuracy, correct: q.correct, total };
}

function finishLevel(L) {
  const j = getJourney(L.jid);
  const lvl = j.levels[L.idx];

  lvl.status = 'completed';
  lvl.progress = 100;
  lvl.mastery = lvl.mastery || L.results.overall;

  const next = j.levels[L.idx + 1];
  if (next && next.status === 'locked') next.status = 'current';

  const bonus = lvl.xp;
  addXP(bonus, true);
  L.xpBonus = bonus;
  L.stage = 'complete';

  S.counters.levels++;
  S.history.unshift({
    title: j.title,
    level: lvl.title,
    xp: L.xp + bonus,
    when: Date.now()
  });
  S.history = S.history.slice(0, 40);

  if (S.counters.levels >= 1) unlock('first_step');
  if (S.counters.quizzes >= 1 && S.counters.bestQuiz >= 90) unlock('quiz_master');
  if (j.levels.every(l => l.status === 'completed')) unlock('clarity');
  if (S.xp >= 1000) unlock('xp_collector');
  if (S.streak >= 7) unlock('week_warrior');

  S.energy = 5;
  save();

  // tick week day
  const today = new Date().getDay();
  const di = today === 0 ? 6 : today - 1;
  S.week[di] = true;
  save();

  confetti(90);
  render();
}

        </div>`).join('') : '<p style="color:var(--ink-2);font-weight:600">Complete a level to start building your skill map.</p>'}
    </div>

    <h2 class="section-title">Learning history</h2>
    <div class="card">
      ${S.history.length ? `<div class="tl">
        ${S.history.slice(0, 12).map(h => `
          <div class="tl-item">
            <span class="tl-xp">+${h.xp} XP</span>
            <small>${timeAgo(h.when)}</small>
            <b>${esc(h.title)} — ${esc(h.level)}</b>
          </div>`).join('')}
      </div>` : '<p style="color:var(--ink-2);font-weight:600">Nothing yet — your completed levels will show up here.</p>'}
    </div>
    `;
  }
};

function statCard(icon, val, label) {
  return `<div class="stat-card">
    <div class="sc-ico">${icon}</div>
    <b>${esc(val)}</b>
    <span>${esc(label)}</span>
  </div>`;
}

function timeAgo(ts) {
  const d = Date.now() - ts;
  const day = 86400000;
  if (d < 3600000) return 'Just now';
  if (d < day) {
    const h = Math.floor(d / 3600000);
    return h + ' hour' + (h === 1 ? '' : 's') + ' ago';
  }
  if (d < day * 2) return 'Yesterday';
  if (d < day * 7) return Math.floor(d / day) + ' days ago';
  return new Date(ts).toLocaleDateString();
}

    <div class="grid grid-3" style="margin-top:20px">

    <h2 class="section-title">Strengths</h2>

      <div style="display:flex;gap:12px;align-items:center">
        <div style="font-size:30px">💪</div>
        <div>
          <b style="font-weight:900">${esc(strongest ? strongest.title : 'Foundations')}</b>
          <p style="color:var(--ink-2);font-weight:600;font-size:14.5px">
            Your highest mastery at ${strongest ? (strongest.mastery || 80) : 80}%. You applied this consistently.
          </p>
        </div>
      </div>
    </div>

      <div style="display:flex;gap:12px;align-items:center">
        <div style="font-size:30px">🌱</div>

          <b style="font-weight:900">${esc(weakest ? weakest.title : 'The next level')}</b>
          <p style="color:var(--ink-2);font-weight:600;font-size:14.5px">
            ${weakest ? `Sitting at ${weakest.mastery || 70}%. A short review session would lift this quickly.` : 'Keep going — more data will sharpen this.'}
          </p>
        </div>
      </div>
    </div>

      ${done.length ? done.map(l => `
        <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:2px solid var(--line-2)">

      <button class="btn btn--ghost btn--lg" onclick="App.go('new')">Start something new</button>

    `;

SCREENS.settings = {
  render() {
    return `
    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Tune CLARIO to fit your day.</p>

    <h2 class="section-title">Daily goal</h2>
    <div class="card">
      <p style="color:var(--ink-2);font-weight:600;margin-bottom:16px">How much XP do you want to earn each day?</p>

};

function toggleRow(key, icon, title, sub) {
  const on = S.settings[key];
  return `
    <div class="toggle-row">
      <span style="font-size:22px">${icon}</span>
      <div class="tr-txt"><b>${title}</b><small>${sub}</small></div>
      <button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}"
        aria-label="${title}" onclick="toggleSetting('${key}')"></button>
    </div>`;
}

function toggleSetting(key) {
  S.settings[key] = !S.settings[key];
  save();
  render();
  toast(`${key} ${S.settings[key] ? 'on' : 'off'}`, 'green', 1200);
}
window.toggleSetting = toggleSetting;

function setGoal(g) {
  S.dailyGoal = g;
  S.settings.dailyGoal = g;
  if (S.todayXP < g) S._goalCelebrated = false;
  save();
  render();
  toast(`Daily goal set to ${g} XP`, 'green', 1400);
}
window.setGoal = setGoal;

function saveName() {
  const v = $('#setName').value.trim();
  if (!v) { toast('Name can\'t be empty', 'red'); return; }
  S.user.name = v;
  save();
  renderSidebar();
  toast('Name updated', 'green');
}
window.saveName = saveName;

function confirmReset() {
  openModal(`
    <h2>Reset everything?</h2>
    <p>This clears your journeys, XP, streak and achievements. It can't be undone.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn--ghost btn--block" onclick="closeModal()">Cancel</button>
      <button class="btn btn--red btn--block" onclick="doReset()">Reset</button>
    </div>`);
}
window.confirmReset = confirmReset;

function doReset() {
  S = freshState();
  save();
  closeModal();
  App.go('landing');
}
window.doReset = doReset;

function logout() {
  save();
  App.go('landing');
}
window.logout = logout;

      { i:'⏰', t:'Daily goal reminder', s:`You're ${Math.max(0, S.dailyGoal - S.todayXP)} XP away from today's goal.`, when:'Yesterday', c:'blue' }
    ];
    return `
    <h1 class="page-title">Notifications</h1>
    <p class="page-sub">Nothing here is urgent. That's the point.</p>

      ${items.map(n => `

          <div style="flex:1;min-width:0">

    `;
  }
};

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  if (S.onboarded && S.user.name) {
    App.go('home');
  } else if (S.user.name) {
    App.go('mind', { i: 0 });
  } else {
    App.go('landing');
  }

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && !e.shiftKey) {
      const t = document.activeElement;
      if (t && t.tagName === 'TEXTAREA') return;
      const primary = document.querySelector('.lesson-foot .btn:not([disabled])');
      if (primary && App.screen === 'lesson') { e.preventDefault(); primary.click(); }
    }
  });
})();
</script>
